              "publish_step": os.environ.get("PUBLISH_RESULT", "unknown"),
          }
          # "success" means the publish step finished, not that a new
          # digest was pushed: concurrent code edits may discard stale data.
          result = {
              "source_sha": os.environ["GITHUB_SHA"],
              "checked_at_utc": datetime.datetime.now(datetime.timezone.utc).isoformat(timespec="seconds"),
              "run_url": "/".join((os.environ["GITHUB_SERVER_URL"], os.environ["GITHUB_REPOSITORY"], "actions/runs", os.environ["GITHUB_RUN_ID"])),
              "result": "pass" if all(v == "success" for v in outcomes.values()) else "fail",
              "checks": outcomes,
              "note": "Check data/run_status.json checked_at_jst separately to confirm a new digest was published",
          }
          Path("/tmp/vet-seminar-collection-report.json").write_text(
              json.dumps(result, ensure_ascii=False, indent=2) + "\n", encoding="utf-8"
          )
          PY
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          for attempt in 1 2 3; do
            git fetch origin main
            git reset --hard origin/main
            cp /tmp/vet-seminar-collection-report.json data/collection_checks.json
            git add data/collection_checks.json
            if git diff --staged --quiet; then
              exit 0
            fi
            git commit -m "Record collection checks for ${GITHUB_SHA:0:12}"
            if git push origin HEAD:main; then
              exit 0
            fi
            sleep "$((attempt * 2))"
          done
          echo "::error::Could not persist collection report"
          exit 1
