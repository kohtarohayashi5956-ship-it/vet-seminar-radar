name: Vet Seminar Radar

on:
  schedule:
    # 月・木曜日 06:00 JST（前日21:00 UTC）。無料ルール抽出を週2回。
    - cron: '0 21 * * 0,3'
  workflow_dispatch:
  # 修正を反映したときに実サイト巡回も検証する。
  # Actions自身によるデータ更新のコミットはGitHub側で再実行されない。
  push:
    branches: [main]
    paths:
      - 'free_extract.py'
      - 'sources.py'
      - 'merge.py'
      - 'run.py'
      - 'config.py'
      - 'quality.py'
      - 'extract.py'
      - 'render.py'
      - '*.py'
      - 'template.html'
      - 'data/manual_events.csv'
      - '.github/workflows/seminar-radar.yml'
      - 'tests/**'

permissions:
  contents: write

concurrency:
  group: vet-seminar-radar
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          # Needed to reconcile an unrelated CI-report commit safely.
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Run unit tests
        id: unit_tests
        run: python -m unittest discover -s tests -q
      # Extract cache is private GitHub Actions storage, NOT part of GitHub Pages or git history.
      - name: Restore previous extraction cache
        uses: actions/cache@v4
        with:
          path: data/extract_cache.json
          key: extract-v1-${{ github.run_id }}
          restore-keys: |
            extract-v1-
      - name: Fetch seminar listings and render website
        id: collect_data
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          # APIキーだけではAIは動かない。Variablesで1を明示した場合のみ使用。
          SEMINAR_RADAR_USE_AI: ${{ vars.SEMINAR_RADAR_USE_AI }}
          SEMINAR_RADAR_CONTACT: ${{ secrets.SEMINAR_RADAR_CONTACT }}
        run: python run.py
      - name: Validate public outputs
        id: validate_data
        run: python validate_public.py
      - name: Commit public digest and run status
        id: publish_data
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add index.html data/events.json data/run_status.json
          if ! git diff --staged --quiet; then
            git commit -m "Update seminar digest $(date -u +%Y-%m-%d)"
          fi
          # The independent release-check workflow pushes only its CI
          # result JSON using GITHUB_TOKEN. That harmless commit must not
          # discard a successful crawl (bot commits do not queue a new run).
          # A *real* source or data change still invalidates this crawl.
          for attempt in 1 2 3; do
            git fetch origin main
            changed="$(git diff --name-only "$GITHUB_SHA" origin/main)"
            # Both check reports are diagnostic metadata, not source changes.
            if printf '%s\n' "$changed" | grep -Ev '^(data/(release_checks|collection_checks)\.json)?$' | grep -q .; then
              echo "::notice::Source or public data changed during crawl; discarding stale generated files."
              exit 0
            fi
            if [ "$(git rev-parse origin/main)" != "$(git rev-parse HEAD)" ]; then
              if ! git rebase origin/main; then
                git rebase --abort || true
                echo "::error::Cannot safely publish digest after concurrent update."
                exit 1
              fi
            fi
            if git push origin HEAD:main; then
              exit 0
            fi
            sleep "$((attempt * 2))"
          done
          echo "::error::Unable to push seminar digest after retries."
          exit 1

      - name: Persist collection workflow result
        if: always()
        env:
          TESTS_RESULT: ${{ steps.unit_tests.outcome }}
          COLLECT_RESULT: ${{ steps.collect_data.outcome }}
          VALIDATE_RESULT: ${{ steps.validate_data.outcome }}
          PUBLISH_RESULT: ${{ steps.publish_data.outcome }}
        run: |
          python - <<'PY'
          import datetime
          import json
          import os
          from pathlib import Path
          outcomes = {
              "unit_tests": os.environ.get("TESTS_RESULT", "unknown"),
              "collect": os.environ.get("COLLECT_RESULT", "unknown"),
              "validate": os.environ.get("VALIDATE_RESULT", "unknown"),
              "publish_step": os.environ.get("PUBLISH_RESULT", "unknown"),
          }
          # "success" means the publish step finished, not that a new
          # digest was pushed: concurrent code edits may discard stale data.
          result = {
              "source_sha": os.environ["GITHUB_SHA"],
              "checked_at_utc": datetime.datetime.now(datetime.timezone.utc).isoformat(timespec="seconds"),
              "run_url": "/".join((os.environ["GITHUB_SERVER_URL"], os.environ["GITHUB_REPOSITORY"], "actions/runs", os.environ["GITHUB_RUN_ID"])),
              "result": "pass" if all(v == "success" for v in outcomes.values()) else "fail",
              "checks": outcomes,
              "note": "Check data/run_status.json checked_at_jst separately to confirm a new digest was published",
          }
          Path("/tmp/vet-seminar-collection-report.json").write_text(
              json.dumps(result, ensure_ascii=False, indent=2) + "\n", encoding="utf-8"
          )
          PY
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          for attempt in 1 2 3; do
            git fetch origin main
            git reset --hard origin/main
            cp /tmp/vet-seminar-collection-report.json data/collection_checks.json
            git add data/collection_checks.json
            if git diff --staged --quiet; then
              exit 0
            fi
            git commit -m "Record collection checks for ${GITHUB_SHA:0:12}"
            if git push origin HEAD:main; then
              exit 0
            fi
            sleep "$((attempt * 2))"
          done
          echo "::error::Could not persist collection report"
          exit 1
