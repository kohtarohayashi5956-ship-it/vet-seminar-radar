            fi
            if git push origin HEAD:main; then
              exit 0
            fi
            sleep "$((attempt * 2))"
          done
          echo "::error::Unable to push seminar digest after retries."
          exit 1

      - name: Persist collection workflow result
        if: always()
        env:
          TESTS_RESULT: ${{ steps.unit_tests.outcome }}
          COLLECT_RESULT: ${{ steps.collect_data.outcome }}
          VALIDATE_RESULT: ${{ steps.validate_data.outcome }}
