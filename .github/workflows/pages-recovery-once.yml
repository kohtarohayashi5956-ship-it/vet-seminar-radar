name: Recover stuck GitHub Pages deployment (one-time)

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/pages-recovery-once.yml'

permissions:
  contents: read
  pages: write

jobs:
  recover:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Inspect and cancel only the known stuck Pages deployment
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          STUCK_SHA="4190220050536547bee35df0fd13bffbe79fc043"
          API="https://api.github.com/repos/${REPOSITORY}/pages/deployments/${STUCK_SHA}"
          echo "Checking previously blocked Pages deployment ${STUCK_SHA:0:8}"
          STATUS=$(curl --fail --silent --show-error \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            "${API}" | python3 -c 'import json,sys; print(json.load(sys.stdin).get("status", "unknown"))')
          echo "Deployment state: ${STATUS}"
          if [ "${STATUS}" = "deployment_cancelled" ]; then
            echo "Deployment already cancelled; no further action."
          else
            # The Pages status endpoint says 'succeed' but the deployment
            # creator continues to reject ALL new deployments as in-progress
            # for this exact SHA. Explicitly cancel ONLY this stale SHA.
            echo "Requesting cancellation of the specific conflicting Pages SHA."
            curl --fail --silent --show-error -X POST \
              -H "Accept: application/vnd.github+json" \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              "${API}/cancel"
            echo "Explicit cancellation API call succeeded."
          fi
