name: Vet Seminar Radar - Release Checks

on:
  push:
    branches: [main]
    paths:
      - '**.py'
      - 'tests/**'
      - 'template.html'
      - 'requirements.txt'
      - '.github/workflows/release-checks.yml'
  pull_request:
    paths:
      - '**.py'
      - 'tests/**'
      - 'template.html'
      - 'requirements.txt'
      - '.github/workflows/release-checks.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: vet-seminar-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Run offline regression tests
        id: unit_tests
        run: python -m unittest discover -s tests -q
      - name: Render from stored data (no network / no AI)
        id: render
        run: python run.py --offline --out index.html
      - name: Validate public data contract
        id: public_data
        run: python validate_public.py
      - name: Check browser JavaScript syntax
        id: javascript
        run: |
          python - <<'PY'
          from html.parser import HTMLParser
          from pathlib import Path
          class InlineScripts(HTMLParser):
              def __init__(self):
                  super().__init__()
                  self.active = False
                  self.snippets = []
              def handle_starttag(self, tag, attrs):
                  if tag == 'script' and dict(attrs).get('type') != 'application/json':
                      self.active = True
                      self.snippets.append('')
              def handle_data(self, data):
                  if self.active:
                      self.snippets[-1] += data
              def handle_endtag(self, tag):
                  if tag == 'script':
                      self.active = False
          parser = InlineScripts()
          parser.feed(Path('index.html').read_text(encoding='utf-8'))
          assert len(parser.snippets) == 1, 'Expected one inline UI script'
          Path('/tmp/vet-seminar-ui.js').write_text(parser.snippets[0], encoding='utf-8')
          PY
          node --check /tmp/vet-seminar-ui.js
      - name: Confirm generated HTML and controls
        id: controls
        run: |
          python - <<'PY'
          from html.parser import HTMLParser
          from pathlib import Path
          content = Path('index.html').read_text(encoding='utf-8')
          assert '/*__PAYLOAD__*/null' not in content, 'Missing data payload'
          assert 'id="resultSummary"' in content
          assert 'id="fNew"' in content
          assert 'id="certDisclosure"' in content
          assert 'id="composer"' in content
          print('Offline HTML rendering and required controls: OK')
          PY
      - name: Publish release-check summary
        if: always()
        env:
          UNIT_RESULT: ${{ steps.unit_tests.outcome }}
          RENDER_RESULT: ${{ steps.render.outcome }}
          DATA_RESULT: ${{ steps.public_data.outcome }}
          JS_RESULT: ${{ steps.javascript.outcome }}
          UI_RESULT: ${{ steps.controls.outcome }}
        run: |
          {
            echo "## Vet Seminar Radar v1.0 検証結果"
            echo
            echo "| 検査項目 | 結果 |"
            echo "|---|---|"
            echo "| Python単体テスト | $UNIT_RESULT |"
            echo "| HTML再生成 | $RENDER_RESULT |"
            echo "| 公開データ検証 | $DATA_RESULT |"
            echo "| JavaScript構文 | $JS_RESULT |"
            echo "| 主要UI構成 | $UI_RESULT |"
            echo
            echo "この検証はオフラインです。公式サイトでの事実照合とPC/スマホ実機操作の代わりにはなりません。"
          } >> "$GITHUB_STEP_SUMMARY"
      # Save a SHA-labelled summary; do not modify rendered pages or source data.
      - name: Save release-check outcome to repository
        if: ${{ always() && github.event_name != 'pull_request' }}
        env:
          UNIT_RESULT: ${{ steps.unit_tests.outcome }}
          RENDER_RESULT: ${{ steps.render.outcome }}
          DATA_RESULT: ${{ steps.public_data.outcome }}
          JS_RESULT: ${{ steps.javascript.outcome }}
          UI_RESULT: ${{ steps.controls.outcome }}
        run: |
          python - <<'PY'
          import datetime
          import json
          import os
          from pathlib import Path
          checks = {
              "unit_tests": os.environ.get("UNIT_RESULT", "unknown"),
              "render": os.environ.get("RENDER_RESULT", "unknown"),
              "public_data": os.environ.get("DATA_RESULT", "unknown"),
              "javascript": os.environ.get("JS_RESULT", "unknown"),
              "controls": os.environ.get("UI_RESULT", "unknown"),
          }
          result = {
              "source_sha": os.environ["GITHUB_SHA"],
              "checked_at_utc": datetime.datetime.now(datetime.timezone.utc).isoformat(timespec="seconds"),
              "run_url": "/".join((os.environ["GITHUB_SERVER_URL"], os.environ["GITHUB_REPOSITORY"], "actions/runs", os.environ["GITHUB_RUN_ID"])),
              "result": "pass" if all(v == "success" for v in checks.values()) else "fail",
              "checks": checks,
              "note": "Offline checks only; not official source or device validation",
          }
          Path("/tmp/vet-seminar-release-check.json").write_text(
              json.dumps(result, ensure_ascii=False, indent=2) + "\n", encoding="utf-8"
          )
          PY
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          for attempt in 1 2 3; do
            git fetch origin main
            git reset --hard origin/main
            mkdir -p data
            cp /tmp/vet-seminar-release-check.json data/release_checks.json
            git add data/release_checks.json
            if git diff --cached --quiet; then
              exit 0
            fi
            git commit -m "Record release checks for ${GITHUB_SHA:0:12}"
            if git push origin HEAD:main; then
              exit 0
            fi
            sleep "$((attempt * 2))"
          done
          echo "::error::Could not save release-check outcome"
          exit 1
